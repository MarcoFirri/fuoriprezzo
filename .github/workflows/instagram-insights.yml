name: Insight Instagram

on:
  workflow_dispatch:

jobs:
  insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Raccogli gli insight
        run: node .github/scripts/instagram-insights.mjs
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: insights
          path: insights.json
          retention-days: 3
