name: Strategia Instagram

on:
  schedule:
    # Ogni mattina alle 7:40 (ora italiana estiva): rilegge i risultati e aggiorna data/instagram-strategia.json
    - cron: '40 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-strategia
  cancel-in-progress: false

jobs:
  strategia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Aggiorna la strategia
        run: node .github/scripts/instagram-strategia.mjs
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
      - name: Salva
        run: |
          git diff --quiet data/instagram-strategia.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram-strategia.json
          git commit -m "Strategia Instagram $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
