name: Pubblica su Telegram

on:
  push:
    branches: [main]
    paths: ['data/offerte.js']
  workflow_dispatch:
    inputs:
      asin:
        description: "ASIN dell'offerta da pubblicare, oppure 'tutte'"
        required: true
        default: tutte

jobs:
  telegram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Invia le offerte nuove al canale
        run: node .github/scripts/telegram.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE_ASIN: ${{ github.event.inputs.asin }}
