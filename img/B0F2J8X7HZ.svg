<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#141218"/>
      <stop offset=".35" stop-color="#4A4652"/>
      <stop offset=".7" stop-color="#2A2730"/>
      <stop offset="1" stop-color="#0E0C12"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050407"/>
      <stop offset=".45" stop-color="#1C1A22"/>
      <stop offset="1" stop-color="#050407"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C3C9D4"/>
    </linearGradient>
    <radialGradient id="led" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#9CF0C8"/>
      <stop offset="1" stop-color="#9CF0C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="200" cy="296" rx="96" ry="12" fill="#17112A" opacity=".24"/>

  <!-- base di ricarica -->
  <path d="M132 262c0-10 30-18 68-18s68 8 68 18v14c0 10-30 18-68 18s-68-8-68-18z" fill="url(#base)"/>
  <ellipse cx="200" cy="262" rx="68" ry="18" fill="#FFFFFF"/>
  <ellipse cx="200" cy="262" rx="30" ry="8" fill="#D5DAE3"/>

  <g transform="rotate(8 200 160)">
    <!-- testina rotonda -->
    <rect x="191" y="24" width="18" height="70" rx="9" fill="#F3F4F7"/>
    <ellipse cx="200" cy="30" rx="19" ry="21" fill="#FFFFFF" stroke="#C9CED8" stroke-width="2"/>
    <g fill="#5FB8F5">
      <circle cx="200" cy="30" r="3"/>
      <circle cx="192" cy="24" r="2.6"/><circle cx="208" cy="24" r="2.6"/>
      <circle cx="192" cy="36" r="2.6"/><circle cx="208" cy="36" r="2.6"/>
      <circle cx="200" cy="18" r="2.6"/><circle cx="200" cy="42" r="2.6"/>
    </g>
    <g fill="#FFFFFF" opacity=".9">
      <circle cx="187" cy="30" r="2.2"/><circle cx="213" cy="30" r="2.2"/>
    </g>
    <!-- collo -->
    <path d="M190 92h20l6 22h-32z" fill="#E4E6EC"/>
    <!-- manico -->
    <rect x="176" y="110" width="48" height="152" rx="22" fill="url(#body)"/>
    <!-- impugnatura -->
    <rect x="183" y="150" width="34" height="96" rx="16" fill="url(#grip)"/>
    <!-- pulsante e luci -->
    <circle cx="200" cy="176" r="10" fill="#FFFFFF" opacity=".95"/>
    <path d="M200 170v8M195 173a7 7 0 1 0 10 0" fill="none" stroke="#1C1A22" stroke-width="2" stroke-linecap="round"/>
    <circle cx="200" cy="206" r="9" fill="url(#led)"/>
    <circle cx="200" cy="206" r="3" fill="#9CF0C8"/>
    <circle cx="200" cy="222" r="2.4" fill="#9CF0C8" opacity=".8"/>
    <circle cx="200" cy="234" r="2.4" fill="#9CF0C8" opacity=".55"/>
    <!-- riflesso -->
    <rect x="183" y="118" width="6" height="128" rx="3" fill="#FFFFFF" opacity=".18"/>
  </g>
</svg>
